<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praia's Grill — Cardápio Digital & Sistema Gastronômico</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #121212;
  --bg-card: #1e1e1e;
  --bg-panel: #282828;
  --border: #333333;
  --accent: #d97706;
  --accent-hover: #b45309;
  --accent-glow: rgba(217, 119, 6, 0.2);
  --text: #f3f4f6;
  --text-dim: #9ca3af;
  --text-bright: #ffffff;
  --green: #10b981;
  --red: #ef4444;
  --radius: 12px;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-serif: 'Playfair Display', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-dark); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
h1, h2, h3 { font-family: var(--font-serif); }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; font-weight: 600; border-radius: var(--radius); border: none; cursor: pointer; transition: 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg-panel); }
input, select, textarea { width: 100%; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; color: var(--text-bright); font-family: var(--font-sans); font-size: 14px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge-accent { background: rgba(217,119,6,0.15); color: #fbbf24; }
.badge-green { background: rgba(16,185,129,0.15); color: #34d399; }
.badge-red { background: rgba(239,68,68,0.15); color: #f87171; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-4 { gap: 16px; }
.grid { display: grid; }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media(max-width: 768px) { .grid-cols-2, .grid-cols-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div id="app"></div>
  <script>
    const DB_KEY = 'praias_grill_db_v2';
    const defaultData = {
      config: {
        nome: "Praia's Grill",
        endereco: "Rod. MA-203 (Estrada do Araçagy), nº 3, São José de Ribamar - MA, CEP 65110-000",
        telefone: "(98) 99168-5098",
        instagram: "@praiasgrill",
        aberto: true,
        taxaPadrao: 7.00
      },
      categorias: [
        { id: 'c1', nome: 'Cardápio do dia' },
        { id: 'c2', nome: 'Carnes e Grelhados' },
        { id: 'c3', nome: 'Galeto e Frangos' },
        { id: 'c4', nome: 'Acompanhamentos' },
        { id: 'c5', nome: 'Bebidas' },
        { id: 'c6', nome: 'Combos' }
      ],
      produtos: [
        {
          id: 'p1',
          nome: 'Picanha Suculenta',
          desc: 'Corte nobre grelhado na brasa, servido com arroz, vinagrete, farofa e fritas.',
          categoria: 'Carnes e Grelhados',
          preco: 39.90,
          custo: 16.00,
          foto: 'https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=600&q=80',
          disponivel: true,
          destaque: true,
          preparo: '20 min'
        },
        {
          id: 'p2',
          nome: 'Galeto à Brasa Inteiro',
          desc: 'Galeto marinado com tempero especial da casa e assado na brasa.',
          categoria: 'Galeto e Frangos',
          preco: 32.00,
          custo: 12.00,
          foto: 'https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?auto=format&fit=crop&w=600&q=80',
          disponivel: true,
          destaque: true,
          preparo: '25 min'
        },
        {
          id: 'p3',
          nome: 'Coca-Cola Lata 350ml',
          desc: 'Gelada 350ml',
          categoria: 'Bebidas',
          preco: 6.00,
          custo: 2.50,
          foto: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80',
          disponivel: true,
          destaque: false,
          preparo: '2 min'
        }
      ],
      gruposPersonalizacao: [
        {
          id: 'g1',
          nome: 'Escolha seu Acompanhamento',
          obrigatorio: true,
          max: 2,
          opcoes: [
            { nome: 'Arroz Branco', preco: 0 },
            { nome: 'Batata Frita', preco: 4.00 },
            { nome: 'Vinagrete Extra', preco: 2.50 },
            { nome: 'Farofa da Casa', preco: 2.00 }
          ]
        }
      ],
      insumos: [
        { id: 'i1', nome: 'Picanha', qtd: 15.5, minimo: 5, unidade: 'kg', custo: 45.00 },
        { id: 'i2', nome: 'Arroz', qtd: 30, minimo: 10, unidade: 'kg', custo: 5.50 },
        { id: 'i3', nome: 'Coca-Cola Lata', qtd: 48, minimo: 12, unidade: 'unidade', custo: 2.50 }
      ],
      pedidos: [],
      clientes: []
    };

    function getDB() {
      const saved = localStorage.getItem(DB_KEY);
      if (!saved) {
        localStorage.setItem(DB_KEY, JSON.stringify(defaultData));
        return defaultData;
      }
      try { return JSON.parse(saved); } catch(e) { return defaultData; }
    }

    function saveDB(data) {
      localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    function router() {
      const path = window.location.pathname;
      const app = document.getElementById('app');
      if (path === '/gestao') {
        renderGestao(app);
      } else if (path === '/master') {
        renderMaster(app);
      } else {
        renderCliente(app);
      }
    }

    let currentCliente = JSON.parse(localStorage.getItem('praias_cliente') || 'null');
    let carrinho = [];
    let modalProduto = null;

    function renderCliente(container) {
      const db = getDB();
      if (!currentCliente) {
        container.innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
            <div class="card" style="max-width:420px;width:100%;text-align:center;">
              <h1 style="color:var(--accent);margin-bottom:8px;">Praia's Grill</h1>
              <p style="color:var(--text-dim);margin-bottom:24px;font-size:14px;">Informe seus dados para acessar o cardápio e fazer seu pedido online.</p>
              <form id="form-identidade" style="display:flex;flex-direction:column;gap:16px;text-align:left;">
                <div>
                  <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;text-transform:uppercase;">Nome Completo</label>
                  <input type="text" id="cli-nome" required placeholder="Ex: João Silva">
                </div>
                <div>
                  <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;text-transform:uppercase;">WhatsApp / Telefone</label>
                  <input type="text" id="cli-fone" required placeholder="Ex: (98) 99999-9999">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Acessar Cardápio Digital</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('form-identidade').onsubmit = (e) => {
          e.preventDefault();
          const nome = document.getElementById('cli-nome').value.trim();
          const fone = document.getElementById('cli-fone').value.trim();
          if (!nome || !fone) return alert('Preencha nome e WhatsApp.');
          currentCliente = { nome, fone };
          localStorage.setItem('praias_cliente', JSON.stringify(currentCliente));
          renderCliente(container);
        };
        return;
      }

      container.innerHTML = `
        <header style="background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:16px 20px;">
          <div class="container" style="display:flex;align-items:center;justify-content:between;padding:0;">
            <div>
              <h2 style="color:var(--accent);font-size:22px;">🔥 Praia's Grill</h2>
              <span style="font-size:12px;color:var(--text-dim);">Olá, <strong>${currentCliente.nome}</strong> | ${db.config.endereco}</span>
            </div>
            <div style="display:flex;gap:12px;align-items:center;">
              <button class="btn btn-outline" onclick="abrirCarrinho()">🛒 Carrinho (<span id="cart-count">${carrinho.length}</span>)</button>
              <button class="btn btn-outline" onclick="sairCliente()" title="Sair">Sair</button>
            </div>
          </div>
        </header>
        <main class="container" style="padding-top:30px;padding-bottom:60px;">
          <div class="card" style="background:linear-gradient(135deg, #1e1e1e, #2a1a08);margin-bottom:30px;border-color:var(--accent);">
            <span class="badge badge-accent">Restaurante Aberto</span>
            <h1 style="font-size:28px;margin-top:10px;">Sabores autênticos da brasa</h1>
            <p style="color:var(--text-dim);margin-top:6px;max-width:600px;">Escolha seus pratos favoritos, carnes grelhadas, galetos e acompanhamentos preparados com excelência.</p>
            <div style="margin-top:16px;display:flex;gap:16px;font-size:13px;color:var(--text-dim);">
              <span>📞 ${db.config.telefone}</span>
              <span>⭐ Avaliação Google: 4.4 (59 avaliações)</span>
            </div>
          </div>

          <h3 style="margin-bottom:16px;">Cardápio Oficial</h3>
          <div class="grid grid-cols-3" style="gap:20px;" id="produtos-grid">
            ${db.produtos.map(p => `
              <div class="card" style="display:flex;flex-direction:column;justify-content:between;cursor:pointer;" onclick="abrirProduto('${p.id}')">
                <div>
                  <img src="${p.foto}" alt="${p.nome}" style="width:100%;height:160px;object-fit:cover;border-radius:8px;margin-bottom:12px;">
                  <span class="badge badge-accent" style="margin-bottom:8px;">${p.categoria}</span>
                  <h4 style="font-size:18px;margin-bottom:6px;">${p.nome}</h4>
                  <p style="color:var(--text-dim);font-size:13px;margin-bottom:12px;">${p.desc}</p>
                </div>
                <div style="display:flex;align-items:center;justify-content:between;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
                  <strong style="color:var(--accent);font-size:18px;">R$ ${p.preco.toFixed(2)}</strong>
                  <button class="btn btn-primary" style="padding:6px 12px;font-size:13px;">Personalizar</button>
                </div>
              </div>
            `).join('')}
          </div>
        </main>
        <div id="modal-container"></div>
        <div id="carrinho-drawer"></div>
      `;
    }

    window.sairCliente = function() {
      localStorage.removeItem('praias_cliente');
      currentCliente = null;
      renderCliente(document.getElementById('app'));
    }

    window.abrirProduto = function(id) {
      const db = getDB();
      const p = db.produtos.find(x => x.id === id);
      if (!p) return;
      modalProduto = { produto: p, qtd: 1 };
      optsSelecionadas = [];
      
      const modalDiv = document.getElementById('modal-container');
      modalDiv.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;">
          <div class="card" style="max-width:600px;width:100%;background:var(--bg-panel);max-height:90vh;overflow-y:auto;">
            <div style="display:flex;justify-content:between;align-items:center;margin-bottom:16px;">
              <h3 style="font-size:20px;">${p.nome}</h3>
              <button class="btn btn-outline" onclick="fecharModal()">✕</button>
            </div>
            <img src="${p.foto}" style="width:100%;height:220px;object-fit:cover;border-radius:8px;margin-bottom:16px;">
            <p style="color:var(--text-dim);font-size:14px;margin-bottom:16px;">${p.desc}</p>
            <h4 style="margin-bottom:10px;color:var(--accent);">Acompanhamentos e Opcionais</h4>
            <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
              ${db.gruposPersonalizacao.map(g => g.opcoes.map(op => `
                <label style="display:flex;align-items:center;justify-content:between;background:var(--bg-card);padding:10px 14px;border-radius:8px;cursor:pointer;">
                  <span style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" onchange="toggleOpcao('${op.nome}', ${op.preco})"> ${op.nome}
                  </span>
                  <span style="color:var(--accent);">+ R$ ${op.preco.toFixed(2)}</span>
                </label>
              `).join('')).join('')}
            </div>
            <div style="display:flex;align-items:center;justify-content:between;border-top:1px solid var(--border);padding-top:16px;">
              <strong style="font-size:20px;" id="modal-total">R$ ${p.preco.toFixed(2)}</strong>
              <button class="btn btn-primary" onclick="adicionarAoCarrinho('${p.id}')">Adicionar ao Carrinho</button>
            </div>
          </div>
        </div>
      `;
    }

    window.fecharModal = function() {
      document.getElementById('modal-container').innerHTML = '';
    }

    let optsSelecionadas = [];
    window.toggleOpcao = function(nome, preco) {
      const idx = optsSelecionadas.findIndex(x => x.nome === nome);
      if (idx > -1) optsSelecionadas.splice(idx, 1);
      else optsSelecionadas.push({ nome, preco });
      
      if (modalProduto) {
        let total = modalProduto.produto.preco;
        optsSelecionadas.forEach(o => total += o.preco);
        document.getElementById('modal-total').innerText = `R$ ${total.toFixed(2)}`;
      }
    }

    window.adicionarAoCarrinho = function(id) {
      const db = getDB();
      const p = db.produtos.find(x => x.id === id);
      if (!p) return;
      let totalUnitario = p.preco;
      optsSelecionadas.forEach(o => totalUnitario += o.preco);
      carrinho.push({
        id: Math.random().toString(),
        produtoId: p.id,
        nome: p.nome,
        precoUnitario: totalUnitario,
        opcoes: [...optsSelecionadas],
        qtd: 1,
        foto: p.foto
      });
      optsSelecionadas = [];
      fecharModal();
      document.getElementById('cart-count').innerText = carrinho.length;
      alert('Item adicionado ao carrinho!');
    }

    window.abrirCarrinho = function() {
      const db = getDB();
      let subtotal = 0;
      carrinho.forEach(i => subtotal += i.precoUnitario * i.qtd);

      const drawer = document.getElementById('carrinho-drawer');
      drawer.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;justify-content:flex-end;z-index:2000;">
          <div style="background:var(--bg-panel);width:100%;max-width:450px;height:100%;padding:24px;display:flex;flex-direction:column;justify-content:between;overflow-y:auto;">
            <div>
              <div style="display:flex;justify-content:between;align-items:center;margin-bottom:20px;">
                <h3 style="font-size:22px;">Seu Carrinho</h3>
                <button class="btn btn-outline" onclick="fecharCarrinho()">✕</button>
              </div>
              ${carrinho.length === 0 ? '<p style="color:var(--text-dim);text-align:center;margin-top:40px;">Seu carrinho está vazio.</p>' : `
                <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
                  ${carrinho.map((item, idx) => `
                    <div class="card" style="display:flex;gap:12px;align-items:center;padding:12px;">
                      <img src="${item.foto}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;">
                      <div style="flex:1;">
                        <h4 style="font-size:15px;">${item.nome}</h4>
                        <span style="font-size:12px;color:var(--text-dim);">${item.opcoes.map(o => o.nome).join(', ') || 'Sem adicionais'}</span>
                        <div style="color:var(--accent);font-weight:700;font-size:14px;margin-top:4px;">R$ ${(item.precoUnitario * item.qtd).toFixed(2)}</div>
                      </div>
                      <button class="btn btn-outline" style="padding:4px 8px;color:var(--red);" onclick="removerCarrinho(${idx})">🗑️</button>
                    </div>
                  `).join('')}
                </div>
                
                <h4 style="margin-bottom:10px;font-size:16px;">Modalidade de Pedido</h4>
                <div style="display:flex;gap:10px;margin-bottom:16px;">
                  <label style="flex:1;background:var(--bg-card);padding:10px;border-radius:8px;text-align:center;cursor:pointer;">
                    <input type="radio" name="mod_ped" value="delivery" checked onchange="toggleModalidade('delivery')"> Delivery
                  </label>
                  <label style="flex:1;background:var(--bg-card);padding:10px;border-radius:8px;text-align:center;cursor:pointer;">
                    <input type="radio" name="mod_ped" value="retirada" onchange="toggleModalidade('retirada')"> Retirada
                  </label>
                </div>
                
                <div id="endereco-box" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
                  <input type="text" id="end-rua" placeholder="Rua e Número (Ex: Rua Principal, 123)">
                  <input type="text" id="end-bairro" placeholder="Bairro (Ex: Araçagy)">
                </div>
              `}
            </div>

            ${carrinho.length > 0 ? `
              <div>
                <div style="border-top:1px solid var(--border);padding-top:16px;margin-bottom:16px;">
                  <div style="display:flex;justify-content:between;margin-bottom:6px;">
                    <span style="color:var(--text-dim);">Subtotal</span>
                    <span>R$ ${subtotal.toFixed(2)}</span>
                  </div>
                  <div style="display:flex;justify-content:between;margin-bottom:6px;">
                    <span style="color:var(--text-dim);">Taxa de Entrega</span>
                    <span id="taxa-entrega-val">R$ ${db.config.taxaPadrao.toFixed(2)}</span>
                  </div>
                  <div style="display:flex;justify-content:between;font-size:18px;font-weight:700;margin-top:10px;">
                    <span>Total</span>
                    <span style="color:var(--accent);" id="total-geral">R$ ${(subtotal + db.config.taxaPadrao).toFixed(2)}</span>
                  </div>
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="finalizarPedido()">Finalizar Pedido</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    window.fecharCarrinho = function() {
      document.getElementById('carrinho-drawer').innerHTML = '';
    }

    window.removerCarrinho = function(idx) {
      carrinho.splice(idx, 1);
      document.getElementById('cart-count').innerText = carrinho.length;
      abrirCarrinho();
    }

    window.toggleModalidade = function(mod) {
      const box = document.getElementById('endereco-box');
      const taxaEl = document.getElementById('taxa-entrega-val');
      const db = getDB();
      let subtotal = 0;
      carrinho.forEach(i => subtotal += i.precoUnitario * i.qtd);
      
      if (mod === 'retirada') {
        box.style.display = 'none';
        taxaEl.innerText = 'R$ 0.00';
        document.getElementById('total-geral').innerText = `R$ ${subtotal.toFixed(2)}`;
      } else {
        box.style.display = 'flex';
        taxaEl.innerText = `R$ ${db.config.taxaPadrao.toFixed(2)}`;
        document.getElementById('total-geral').innerText = `R$ ${(subtotal + db.config.taxaPadrao).toFixed(2)}`;
      }
    }

    window.finalizarPedido = function() {
      if (carrinho.length === 0) return;
      const db = getDB();
      let subtotal = 0;
      carrinho.forEach(i => subtotal += i.precoUnitario * i.qtd);
      const isRetirada = document.querySelector('input[name="mod_ped"]:checked').value === 'retirada';
      const taxa = isRetirada ? 0 : db.config.taxaPadrao;
      
      const novoPedido = {
        id: 'PED-' + Math.floor(1000 + Math.random() * 9000),
        cliente: currentCliente.nome,
        fone: currentCliente.fone,
        modalidade: isRetirada ? 'retirada' : 'delivery',
        endereco: isRetirada ? 'Retirada: Rod. MA-203, nº 3, Araçagy' : (document.getElementById('end-rua').value || 'Não informado'),
        itens: [...carrinho],
        total: subtotal + taxa,
        status: 'Novo pedido',
        data: new Date().toLocaleString()
      };

      db.pedidos.unshift(novoPedido);
      saveDB(db);
      carrinho = [];
      fecharCarrinho();
      alert(`Pedido ${novoPedido.id} realizado com sucesso! Acompanhe na gestão.`);
      renderCliente(document.getElementById('app'));
    }

    function renderGestao(container) {
      const db = getDB();
      container.innerHTML = `
        <div class="container" style="padding-top:40px;padding-bottom:60px;">
          <div style="display:flex;justify-content:between;align-items:center;margin-bottom:30px;">
            <div>
              <h1 style="color:var(--accent);">Painel de Gestão — Praia's Grill</h1>
              <p style="color:var(--text-dim);">Controle operacional e pedidos em tempo real</p>
            </div>
            <a href="/" class="btn btn-outline">Ver Cardápio</a>
          </div>

          <div class="grid grid-cols-3" style="gap:20px;margin-bottom:30px;">
            <div class="card">
              <span style="color:var(--text-dim);font-size:13px;">Pedidos Hoje</span>
              <h2 style="font-size:28px;margin-top:6px;">${db.pedidos.length}</h2>
            </div>
            <div class="card">
              <span style="color:var(--text-dim);font-size:13px;">Faturamento do Dia</span>
              <h2 style="font-size:28px;margin-top:6px;color:var(--green);">R$ ${db.pedidos.reduce((acc, p) => acc + p.total, 0).toFixed(2)}</h2>
            </div>
            <div class="card">
              <span style="color:var(--text-dim);font-size:13px;">Produtos Cadastrados</span>
              <h2 style="font-size:28px;margin-top:6px;">${db.produtos.length}</h2>
            </div>
          </div>

          <h3 style="margin-bottom:16px;">Pedidos Operacionais</h3>
          <div style="display:flex;flex-direction:column;gap:16px;">
            ${db.pedidos.length === 0 ? '<p style="color:var(--text-dim);">Nenhum pedido recebido ainda.</p>' : db.pedidos.map(ped => `
              <div class="card" style="display:flex;justify-content:between;align-items:center;">
                <div>
                  <div style="display:flex;gap:12px;align-items:center;margin-bottom:6px;">
                    <strong style="color:var(--accent);">${ped.id}</strong>
                    <span class="badge badge-accent">${ped.status}</span>
                    <span class="badge badge-green">${ped.modalidade.toUpperCase()}</span>
                  </div>
                  <h4 style="font-size:16px;">${ped.cliente} — ${ped.fone}</h4>
                  <p style="color:var(--text-dim);font-size:13px;margin-top:4px;">${ped.itens.map(i => `${i.qtd}x ${i.nome}`).join(', ')}</p>
                  <span style="font-size:12px;color:var(--text-dim);">Endereço: ${ped.endereco} | ${ped.data}</span>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:18px;font-weight:700;color:var(--accent);margin-bottom:10px;">R$ ${ped.total.toFixed(2)}</div>
                  <select onchange="alterarStatus('${ped.id}', this.value)" style="padding:6px;font-size:12px;">
                    <option ${ped.status === 'Novo pedido' ? 'selected' : ''}>Novo pedido</option>
                    <option ${ped.status === 'Em preparação' ? 'selected' : ''}>Em preparação</option>
                    <option ${ped.status === 'Pronto / Saiu para Entrega' ? 'selected' : ''}>Pronto / Saiu para Entrega</option>
                    <option ${ped.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                  </select>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    window.alterarStatus = function(id, status) {
      const db = getDB();
      const ped = db.pedidos.find(x => x.id === id);
      if (ped) {
        ped.status = status;
        saveDB(db);
        alert('Status atualizado!');
        renderGestao(document.getElementById('app'));
      }
    }

    function renderMaster(container) {
      const db = getDB();
      container.innerHTML = `
        <div class="container" style="padding-top:40px;padding-bottom:60px;">
          <div style="display:flex;justify-content:between;align-items:center;margin-bottom:30px;">
            <div>
              <h1 style="color:var(--accent);">Painel Master — Estratégia & Estoque</h1>
              <p style="color:var(--text-dim);">Controle de insumos, fichas técnicas, custos e precificação</p>
            </div>
            <a href="/" class="btn btn-outline">Ver Cardápio</a>
          </div>

          <div class="grid grid-cols-2" style="gap:20px;margin-bottom:30px;">
            <div class="card">
              <h3 style="margin-bottom:16px;color:var(--accent);">Estoque de Insumos</h3>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${db.insumos.map(i => `
                  <div style="display:flex;justify-content:between;background:var(--bg-panel);padding:10px 14px;border-radius:8px;">
                    <span>${i.nome}</span>
                    <strong>${i.qtd} ${i.unidade} (Mín: ${i.minimo})</strong>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="card">
              <h3 style="margin-bottom:16px;color:var(--accent);">Precificação & Fichas Técnicas</h3>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${db.produtos.map(p => `
                  <div style="display:flex;justify-content:between;background:var(--bg-panel);padding:10px 14px;border-radius:8px;">
                    <span>${p.nome} (Custo: R$ ${p.custo.toFixed(2)})</span>
                    <strong style="color:var(--accent);">Venda: R$ ${p.preco.toFixed(2)}</strong>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    window.addEventListener('popstate', router);
    window.onload = router;
  </script>
</body>
</html>
